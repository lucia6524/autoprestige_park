services:
  - type: web
    name: autoprestige-site
    runtime: static
    plan: free
    staticPublishPath: .
    buildCommand: echo "no build needed"
    routes:
      - type: rewrite
        source: /\*404.html
        destination: /404.html

  - type: web
    name: autoprestige-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: DATABASE_URL
        fromDatabase:
          name: progrest
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: b7c0a1001@smtp-brevo.com
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: autoprestigepark@outlook.com
      - key: CONTACT_RECIPIENT_EMAIL
        value: autoprestigepark@outlook.com
      - key: BREVO_API_KEY
        sync: false

databases:
  - name: progrest
    databaseName: progrest
    user: progrest
    plan: free
