services:
  - type: web
    name: autohaus-park
    runtime: static
    plan: free
    # Astro builds the site (all HTML pages pre-generated) into frontend/dist
    staticPublishPath: frontend/dist
    buildCommand: cd frontend && npm install --no-fund --no-audit && npm run build
    # Render sert automatiquement le fichier 404.html du dossier publié pour
    # les URL inexistantes — pas besoin d'une règle de réécriture. (L'ancienne
    # règle `/*404.html` était cassée et ne correspondait à aucune URL.)

  - type: web
    name: autohaus-park-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: DATABASE_URL
        fromDatabase:
          name: autohaus-park-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: autoprestigepark@outlook.com
      - key: CONTACT_RECIPIENT_EMAIL
        value: autoprestigepark@outlook.com
      - key: BREVO_API_KEY
        sync: false
      - key: TRANSLATION_PROVIDER
        value: deepl
      - key: DEEPL_API_KEY
        sync: false

databases:
  - name: autohaus-park-db
    databaseName: autohaus_park_db
    user: autohaus_park
    plan: free
