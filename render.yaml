services:
  - type: web
    name: autohaus-park
    runtime: static
    plan: free
    # Astro builds the site (all HTML pages pre-generated) into frontend/dist
    staticPublishPath: frontend/dist
    buildCommand: cd frontend && npm ci --no-fund --no-audit && npm run build
    # Render sert automatiquement le fichier 404.html du dossier publié pour
    # les URL inexistantes — pas besoin d'une règle de réécriture. (L'ancienne
    # règle `/*404.html` était cassée et ne correspondait à aucune URL.)
    # En-têtes de sécurité appliqués par Render (le fichier `_headers` n'est
    # pas supporté par Render static — cf. https://render.com/docs/static-site-headers).
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()
      - path: /*
        name: Content-Security-Policy
        # GTranslate free (traduction côté navigateur) : dropdown.js + lib.min.js
        # depuis cdn.gtranslate.net (script-src) et appels XHR vers
        # translate-pa.googleapis.com (connect-src). Sans ces domaines dans le
        # CSP, le navigateur ne charge pas le widget et le sélecteur de langue
        # n'apparaît jamais.
        value: default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.gtranslate.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https:; connect-src 'self' https://autohaus-park-api.onrender.com https://cdn.gtranslate.net https://translate-pa.googleapis.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'
      # --- Performance : cache navigateur long sur les assets statiques ---
      # Le défaut Render (`max-age=0, s-maxage=300`) force une revalidation à
      # chaque visite → 7 fichiers JS + CSS rechargés 0,5-1 s chacun.
      # Les fichiers ne sont pas hashés (copies de public/) → un jour est sûr.
      # Les fonts (immutables, nom fixe) : un an.
      - path: /js/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /css/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /thumbs/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /*.webp
        name: Cache-Control
        value: public, max-age=86400
      - path: /*.png
        name: Cache-Control
        value: public, max-age=86400
      - path: /*.svg
        name: Cache-Control
        value: public, max-age=86400

  - type: web
    name: autohaus-park-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Health check sur la route de santé de l'app pour éviter que Render ne
    # tue l'instance durant les cold starts (plan gratuit).
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: DATABASE_URL
        fromDatabase:
          name: autohaus-park-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: autoprestigepark@outlook.com
      - key: CONTACT_RECIPIENT_EMAIL
        value: autoprestigepark@outlook.com
      - key: BREVO_API_KEY
        sync: false
      # Traduction dynamique : endpoint public gratuit de Google (sans clé).
      # Le provider DeepL est retiré — aucun quota à configurer.

databases:
  - name: autohaus-park-db
    databaseName: autohaus_park_db
    user: autohaus_park
    plan: free
