# Configuration Alembic pour l'API Autohaus (async).
# Usage (depuis backend/) :
#   .venv/Scripts/alembic upgrade head      # applique les migrations
#   .venv/Scripts/alembic revision --autogenerate -m "description"
#   .venv/Scripts/alembic history           # historique
# En prod, DATABASE_URL vient des variables d'environnement Render (fichier
# .env ou variables du service). script_location est relatif au backend/.

[alembic]
script_location = alembic
prepend_sys_path = .
# URL par défaut (dev) : il est TOUJOURS prioritaire de passer DATABASE_URL
# dans l'environnement. Alembic lit DATABASE_URL de l'environnement et, si
# absent, retombe sur cette valeur.
sqlalchemy.url = sqlite+aiosqlite:///data/alembic_migrate.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S