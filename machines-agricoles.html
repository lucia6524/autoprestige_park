<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Machines agricoles — AutoPrestige</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script>
      var p = localStorage.getItem("theme");
      if (p !== "light" && p !== "dark") p = "dark";
      document.documentElement.setAttribute("data-theme", p);
    </script>
  </head>
  <body data-i18n-title="meta.title_agri">
    <!-- Site header (injecté par js/header.js) -->
    <div id="site-header"></div>

    <section class="page-hero">
      <div class="page-hero-bg">
        <img
          src="https://images.unsplash.com/photo-1581092160562-40aa08e78837?w=1920&q=80"
          alt="Machines agricoles"
        />
      </div>
      <div class="page-hero-overlay"></div>
      <div class="container">
        <span class="label">Machines agricoles</span>
        <h1>Matériel agricole</h1>
        <p>
          Tracteurs, engins et matériel agricole. Contactez-nous pour connaître
          les disponibilités et obtenir un devis personnalisé.
        </p>
        <div style="margin-top: 30px">
          <a href="contact.html" class="btn btn-primary btn-lg"
            >Nous contacter</a
          >
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="container">
        <div class="footer-bottom" style="border: none; padding: 40px 0">
          <span>© 2026 AutoPrestige</span>
        </div>
      </div>
    </footer>
    <script src="js/header.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
