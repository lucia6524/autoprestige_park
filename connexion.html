<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="Logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion — AutoPrestige</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      body {
        background: var(--bg-primary) !important;
        min-height: 100vh;
        color: var(--text-primary);
      }
      .reg-wrap {
        max-width: 420px;
        margin: 0 auto;
        padding: 60px 20px 80px;
      }
      .reg-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 40px 36px;
        box-shadow: var(--shadow-sm);
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      }
      .reg-logo {
        text-align: center;
        margin-bottom: 28px;
        font-size: 1.4rem;
        font-weight: 800;
        color: var(--text-primary);
      }
      .reg-logo span {
        color: var(--accent-light);
      }
      .reg-title {
        font-size: 1.5rem;
        font-weight: 800;
        text-align: center;
        margin: 0 0 8px;
      }
      .reg-sub {
        text-align: center;
        color: var(--text-muted);
        font-size: 0.95rem;
        margin-bottom: 28px;
      }
      label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 14px 16px;
        border: 1.5px solid var(--input-border);
        border-radius: 12px;
        font-size: 1rem;
        font-family: inherit;
        margin-bottom: 18px;
        box-sizing: border-box;
      }
      input:focus {
        outline: none;
        border-color: var(--accent);
      }
      .reg-btn {
        width: 100%;
        padding: 16px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
      }
      .reg-btn:hover {
        background: var(--accent-hover);
      }
      .reg-btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .reg-btn-outline {
        background: transparent;
        color: var(--accent-light);
        border: 1.5px solid var(--accent);
        margin-top: 12px;
      }
      .reg-error,
      .reg-success {
        padding: 12px 16px;
        border-radius: 10px;
        font-size: 0.9rem;
        margin-bottom: 16px;
        display: none;
      }
      .reg-error {
        background: rgba(220, 38, 38, 0.12);
        color: var(--danger);
      }
      .reg-success {
        background: rgba(22, 163, 74, 0.12);
        color: var(--success);
      }
      .reg-error.show,
      .reg-success.show {
        display: block;
      }
      .reg-footer {
        text-align: center;
        margin-top: 24px;
        font-size: 0.9rem;
        color: var(--text-muted);
      }
      .reg-footer a {
        color: var(--accent-light);
        font-weight: 600;
        text-decoration: none;
      }
      .otp-inputs {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin: 20px 0;
      }
      .otp-inputs input {
        width: 48px;
        height: 56px;
        text-align: center;
        font-size: 1.4rem;
        font-weight: 700;
        margin-bottom: 0;
      }
      .panel {
        display: none;
      }
      .panel.active {
        display: block;
      }
    </style>
    <script>
      (function () {
        var p = localStorage.getItem("theme");
        if (p !== "light" && p !== "dark") p = "dark";
        document.documentElement.setAttribute("data-theme", p);
      })();
    </script>
  </head>
  <body>
    <!-- Site header (injecté par js/header.js) -->
    <div id="site-header"></div>

    <div class="reg-wrap">
      <div class="reg-card">
        <div class="reg-logo">Auto-<span>prestige</span></div>
        <h1 class="reg-title">Connexion</h1>
        <p class="reg-sub">Accédez à votre espace client</p>
        <div class="reg-error" id="err"></div>
        <div class="reg-success" id="ok"></div>

        <div class="panel active" id="panel-password">
          <form id="form-password">
            <label for="email">Adresse email</label>
            <input
              type="email"
              id="email"
              required
              placeholder="jean.dupont@gmail.com"
              autocomplete="username"
            />
            <label for="password">Mot de passe</label>
            <input
              type="password"
              id="password"
              required
              minlength="6"
              placeholder="Votre mot de passe"
              autocomplete="current-password"
            />
            <button type="submit" class="reg-btn">Se connecter →</button>
          </form>
          <p
            style="
              text-align: center;
              margin-top: 16px;
              font-size: 0.9rem;
              color: var(--text-muted);
            "
          >
            <a
              href="#"
              id="link-otp"
              style="color: var(--accent-light); font-weight: 600"
              >Connexion avec un code</a
            >
          </p>
        </div>

        <div class="panel" id="panel-otp">
          <form id="form-otp-email" style="margin-bottom: 12px">
            <label for="email-otp">Adresse email</label>
            <input
              type="email"
              id="email-otp"
              required
              placeholder="jean.dupont@gmail.com"
            />
            <button type="submit" class="reg-btn">Envoyer le code →</button>
          </form>
          <form id="form-otp" style="display: none">
            <div
              id="otp-code-box"
              style="
                text-align: center;
                margin: 0 0 16px;
                padding: 14px;
                background: var(--accent-soft);
                border: 1px solid var(--border);
                border-radius: 12px;
              "
            >
              <div style="font-size: 0.85rem; color: var(--text-secondary)">
                Votre code
              </div>
              <div
                id="otp-display-code"
                style="
                  font-size: 1.6rem;
                  font-weight: 800;
                  letter-spacing: 0.3em;
                  color: var(--accent-light);
                "
              ></div>
            </div>
            <p
              style="
                text-align: center;
                color: var(--text-secondary);
                margin-bottom: 8px;
              "
            >
              Saisissez le code pour <strong id="email-display"></strong>
            </p>
            <div class="otp-inputs" id="otp-inputs">
              <input type="text" maxlength="1" inputmode="numeric" />
              <input type="text" maxlength="1" inputmode="numeric" />
              <input type="text" maxlength="1" inputmode="numeric" />
              <input type="text" maxlength="1" inputmode="numeric" />
              <input type="text" maxlength="1" inputmode="numeric" />
              <input type="text" maxlength="1" inputmode="numeric" />
            </div>
            <button type="submit" class="reg-btn">Valider le code →</button>
            <button type="button" class="reg-btn reg-btn-outline" id="back">
              ← Retour
            </button>
          </form>
        </div>

        <div class="reg-footer">
          Pas encore de compte ? <a href="inscription.html">S'inscrire</a>
        </div>
      </div>
    </div>
    <script src="js/header.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script>
      // Déjà connecté → dashboard personnel
      if (window.API && API.isLoggedIn()) {
        window.location.replace("compte.html");
      }

      let email = "";
      const otpInputs = document.querySelectorAll("#otp-inputs input");
      otpInputs.forEach((input, i) => {
        input.addEventListener("input", () => {
          if (input.value && i < 5) otpInputs[i + 1].focus();
        });
        input.addEventListener("keydown", (e) => {
          if (e.key === "Backspace" && !input.value && i > 0)
            otpInputs[i - 1].focus();
        });
      });

      function showErr(m) {
        const e = document.getElementById("err");
        e.textContent = m;
        e.classList.add("show");
        document.getElementById("ok").classList.remove("show");
      }
      function showOk(m) {
        const e = document.getElementById("ok");
        e.textContent = m;
        e.classList.add("show");
        document.getElementById("err").classList.remove("show");
      }
      function showPanel(id) {
        document
          .querySelectorAll(".panel")
          .forEach((p) => p.classList.remove("active"));
        document.getElementById(id).classList.add("active");
      }

      // Login mot de passe (principal)
      document.getElementById("form-password").onsubmit = async (e) => {
        e.preventDefault();
        email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        try {
          const res = await API.loginWithPassword(email, password);
          API.setAuth(res.access_token, res.user);
          showOk("Connexion réussie ! Redirection vers votre espace…");
          setTimeout(() => {
            window.location.replace("compte.html");
          }, 600);
        } catch (err) {
          showErr(err.message);
        }
      };

      document.getElementById("link-otp").onclick = (e) => {
        e.preventDefault();
        showPanel("panel-otp");
      };

      document.getElementById("form-otp-email").onsubmit = async (e) => {
        e.preventDefault();
        email = document.getElementById("email-otp").value.trim();
        try {
          const res = await API.loginRequestCode(email);
          document.getElementById("email-display").textContent = email;
          document.getElementById("otp-display-code").textContent =
            res.code || "";
          document.getElementById("form-otp").style.display = "block";
          showOk("Code généré — saisissez-le ci-dessous.");
        } catch (err) {
          showErr(err.message);
        }
      };

      document.getElementById("form-otp").onsubmit = async (e) => {
        e.preventDefault();
        const code = Array.from(otpInputs)
          .map((i) => i.value)
          .join("");
        if (code.length !== 6) return showErr("Code à 6 chiffres requis.");
        try {
          const res = await API.login(email, code);
          API.setAuth(res.access_token, res.user);
          showOk("Connexion réussie ! Redirection vers votre espace…");
          setTimeout(() => {
            window.location.replace("compte.html");
          }, 600);
        } catch (err) {
          showErr(err.message);
        }
      };

      document.getElementById("back").onclick = () => {
        showPanel("panel-password");
        document.getElementById("form-otp").style.display = "none";
      };
    </script>
  </body>
</html>
